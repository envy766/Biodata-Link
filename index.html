

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linktree Futuristik</title>
<style>
  /* ===== Background Animasi ===== */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(270deg, #ff0057, #00f7ff, #2c5364);
    background-size: 600% 600%;
    animation: gradientMove 10s ease infinite;
    color: white;
    text-align: center;
    padding: 40px;
    min-height: 100vh;
    margin: 0;
    overflow-y: auto;
    position: relative;
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ===== Foto Profil Glow ===== */
  .profile-pic {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #00f7ff;
    box-shadow: 0px 0px 25px #00f7ff;
    margin-bottom: 15px;
    animation: glow 2s infinite alternate;
    transition: transform 0.3s ease;
    position: relative;
    z-index: 2;
  }
  @keyframes glow {
    from { box-shadow: 0 0 15px #00f7ff; }
    to { box-shadow: 0 0 35px #00f7ff; }
  }
  .profile-pic:hover {
    animation: shake 0.5s;
  }
  @keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    25% { transform: translate(-1px, 2px) rotate(-1deg); }
    50% { transform: translate(-3px, 1px) rotate(1deg); }
    75% { transform: translate(3px, 1px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }

  /* ===== Neon Text ===== */
  h1 {
    margin: 10px 0;
    font-size: 26px;
    letter-spacing: 2px;
    color: #00f7ff;
    text-shadow: 0 0 5px #00f7ff, 0 0 10px #00f7ff, 0 0 20px #00f7ff;
    position: relative;
    z-index: 2;
  }
  p {
    font-size: 14px;
    margin-bottom: 30px;
    opacity: 0.9;
    position: relative;
    z-index: 2;
  }

  /* ===== Tombol Neon ===== */
  .link-btn {
    display: block;
    width: 85%;
    max-width: 320px;
    margin: 15px auto;
    padding: 14px;
    background: transparent;
    border: 2px solid #00f7ff;
    color: #00f7ff;
    text-decoration: none;
    font-weight: bold;
    border-radius: 12px;
    transition: 0.3s;
    box-shadow: 0px 0px 12px #00f7ff;
    position: relative;
    z-index: 2;
  }
  .link-btn:hover {
    background: #00f7ff;
    color: black;
    box-shadow: 0px 0 25px #00f7ff, 0 0 50px #00f7ff;
    transform: scale(1.1) rotate(1deg);
  }

  /* ===== Tombol Musik Futuristik ===== */
  .music-btn {
    margin-top: 20px;
    padding: 12px 25px;
    background: transparent;
    border: 2px solid #ff0057;
    color: #ff0057;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 15px #ff0057, 0 0 30px #ff0057;
    position: relative;
    z-index: 2;
  }
  .music-btn:hover {
    background: #ff0057;
    color: #000;
    transform: scale(1.1);
    box-shadow: 0 0 25px #ff0057, 0 0 50px #ff0057;
  }

  footer {
    margin-top: 40px;
    font-size: 12px;
    opacity: 0.7;
    position: relative;
    z-index: 2;
  }

  /* ===== Canvas untuk partikel ===== */
  #particleCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>

<!-- Canvas Partikel -->
<canvas id="particleCanvas"></canvas>

<!-- Foto Profil -->

<!-- Nama & Deskripsi -->

  <source src="musicbg/lagu3.mp3" type="audio/mpeg">

</audio>

<!-- Footer -->
<footer>This Room Was Created By ` 𝕬 𝖋 𝖗 𝖎 𝖟 𝖆 𝖑 ` In September 2025®</footer>

<script>
// ===== Partikel =====
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");

let particles = [];
let animationId;

// ===== Audio Analyzer =====
const music = document.getElementById("bgMusic");

let audioContext;
let analyser;
let source;
let dataArray;
let audioReady = false;

function setupAudio() {
  if (audioReady) return;

  audioContext = new (window.AudioContext || window.webkitAudioContext)();

  analyser = audioContext.createAnalyser();

  // Semakin tinggi = lebih sensitif terhadap detail musik
  analyser.fftSize = 256;

  source = audioContext.createMediaElementSource(music);

  source.connect(analyser);
  analyser.connect(audioContext.destination);

  dataArray = new Uint8Array(analyser.frequencyBinCount);

  audioReady = true;
}

// ===== Canvas =====
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


// ===== Particle Class =====
class Particle {

  constructor() {
    this.reset();
  }

  reset() {

    this.x = Math.random() * canvas.width;

    this.y = canvas.height + Math.random() * 100;

    this.baseSize = Math.random() * 3 + 1;

    this.size = this.baseSize;

    this.baseSpeed = Math.random() * 2 + 1;

    this.speedY = this.baseSpeed;

    this.speedX = (Math.random() - 0.5) * 0.5;

    this.color =
      Math.random() < 0.5
      ? "#00f7ff"
      : "#ff0057";

    this.baseAlpha = Math.random() * 0.5 + 0.3;

    this.alpha = this.baseAlpha;
  }


  update(beat) {

    // ===== Gerakan normal =====

    this.y -= this.speedY;

    this.x += this.speedX;


    // ===== Efek mengikuti musik =====

    this.speedY =
      this.baseSpeed +
      beat * 3;

    this.size =
      this.baseSize +
      beat * 5;

    this.alpha =
      Math.min(
        1,
        this.baseAlpha + beat * 0.7
      );


    // ===== Reset =====

    if (
      this.y < 0 ||
      this.alpha <= 0
    ) {

      this.reset();

    }

  }


  draw(beat) {

    ctx.save();

    ctx.globalAlpha = this.alpha;

    ctx.fillStyle = this.color;

    // ===== Glow mengikuti musik =====

    ctx.shadowBlur =
      5 + beat * 35;

    ctx.shadowColor =
      this.color;


    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

  }

}


// ===== Membuat 100 Partikel =====

for(let i = 0; i < 100; i++) {

  particles.push(
    new Particle()
  );

}


// ===== Animasi =====

function animate() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  let beat = 0;


  // ===== Membaca musik =====

  if(analyser) {

    analyser.getByteFrequencyData(
      dataArray
    );


    let total = 0;

    for(
      let i = 0;
      i < dataArray.length;
      i++
    ) {

      total += dataArray[i];

    }


    beat =
      total /
      dataArray.length /
      255;

  }


  // ===== Update Partikel =====

  particles.forEach(p => {

    p.update(beat);

    p.draw(beat);

  });


  animationId =
    requestAnimationFrame(
      animate
    );

}


// ===== Musik =====

let isPlaying = false;

const btn =
  document.querySelector(".music-btn");


function toggleMusic() {

  if(isPlaying) {

    music.pause();

    btn.textContent =
      "Play Music";

    cancelAnimationFrame(
      animationId
    );

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


  } else {

    setupAudio();


    // Membuka AudioContext
    if(
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    music.play();

    btn.textContent =
      "Pause Music";


    animate();

  }


  isPlaying =
    !isPlaying;

}

</script>

</body>
</html>
