<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Choose Your Room</title>

<link rel="stylesheet" href="style-bio.css">

</head>

<body>


<!-- =========================================
     STARS
========================================= -->

<div class="star" style="top:7%;left:10%;animation-delay:.3s;"></div>
<div class="star" style="top:14%;left:80%;animation-delay:1s;"></div>
<div class="star big" style="top:24%;left:24%;animation-delay:1.5s;"></div>
<div class="star sparkle" style="top:31%;left:88%;animation-delay:.8s;"></div>
<div class="star big" style="top:43%;left:8%;animation-delay:1.8s;"></div>
<div class="star" style="top:52%;left:84%;animation-delay:.9s;"></div>
<div class="star sparkle" style="top:64%;left:18%;animation-delay:1.3s;"></div>
<div class="star big" style="top:73%;left:73%;animation-delay:.4s;"></div>
<div class="star" style="top:84%;left:43%;animation-delay:1.7s;"></div>
<div class="star sparkle" style="top:91%;left:92%;animation-delay:.8s;"></div>
<div class="star" style="top:38%;left:56%;animation-delay:2s;"></div>
<div class="star" style="top:78%;left:5%;animation-delay:1.2s;"></div>


<!-- =========================================
     CANVAS
========================================= -->

<canvas id="meteorCanvas"></canvas>
<canvas id="goldDustCanvas"></canvas>


<!-- =========================================
     MAIN CONTAINER
========================================= -->

<div class="container">


  <!-- =======================================
       TOP SECTION
  ======================================== -->

  <div class="top-section">

    <div class="welcome">
      <span>𝖂</span><span>𝖊</span><span>𝖑</span><span>𝖈</span>
      <span>𝖔</span><span>𝖒</span><span>𝖊</span><span>&nbsp;</span>
      <span>𝖙</span><span>𝖔</span><span>&nbsp;</span>
      <span>𝖒</span><span>𝖞</span><span>&nbsp;</span>
      <span>𝖗</span><span>𝖔</span><span>𝖔</span><span>𝖒</span>
    </div>

    <h1 class="name">
      𝕬 𝖋 𝖗 𝖎 𝖟 𝖆 𝖑
    </h1>

  </div>


  <!-- =======================================
       PHOTO FRAME
  ======================================== -->

  <div class="photo-frame">

    <div class="frame-outer"></div>
    <div class="frame-inner"></div>

    <div class="photo-area">
      <img
        src="imagepp/profile.jpg"
        alt="Afrizal"
      >
    </div>

    <div class="frame-decoration frame-top">❦</div>
    <div class="frame-decoration frame-bottom">❦</div>
    <div class="frame-decoration frame-left">❧</div>
    <div class="frame-decoration frame-right">❧</div>

    <div class="frame-dot dot-1"></div>
    <div class="frame-dot dot-2"></div>
    <div class="frame-dot dot-3"></div>
    <div class="frame-dot dot-4"></div>

  </div>


  <!-- =======================================
       MENU SECTION
  ======================================== -->

  <div class="menu-section">


    <!-- =====================================
         LYRICS
    ====================================== -->

    <div
      id="lyricsDisplay"
      class="lyrics-display"
    ></div>


    <!-- =====================================
         SUBTITLE
    ====================================== -->

    <div class="subtitle">
      __ SEMOGA DI SUATU HARI NANTI __
    </div>


    <!-- =====================================
         LIGHT THEME
    ====================================== -->

    <a
      href="Themes/lightneon.html"
      class="theme-btn light-btn"
      onclick="sessionStorage.setItem('autoPlayMusic', 'true')"
    >
      ✦ LIGHT ✦
    </a>


    <!-- =====================================
         NIGHT THEME
    ====================================== -->

    <a
      href="Themes/nightgold.html"
      class="theme-btn gold-btn"
      onclick="sessionStorage.setItem('autoPlayMusic', 'true')"
    >
      ✦ NIGHT ✦
    </a>


    <!-- =====================================
         MUSIC CONTROLS
    ====================================== -->

    <div class="music-player">

      <button
        id="previousSong"
        class="music-nav"
        type="button"
        aria-label="Previous song"
      >
        ‹
      </button>

      <button
        id="musicToggle"
        class="music-toggle"
        type="button"
        aria-label="Play music"
      >
        PLAY
      </button>

      <button
        id="nextSong"
        class="music-nav"
        type="button"
        aria-label="Next song"
      >
        ›
      </button>

    </div>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer>
      Copyright © August 2026
      𝕬 𝖋 𝖗 𝖎 𝖟 𝖆 𝖑<br>
      All Rights Reserved
    </footer>

  </div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="script-bio.js"></script>
<script src="lyrics-player.js"></script>

</body>
</html>
