<style>

/* =========================================
   RESET
========================================= */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;

  height: 100%;

}


/* =========================================
   BODY / NIGHT SKY
========================================= */

body {

  font-family:
    'Segoe UI',
    Tahoma,
    Geneva,
    Verdana,
    sans-serif;

  background:

    radial-gradient(
      circle at 50% 35%,
      #19150b 0%,
      #090805 45%,
      #000000 100%
    );

  color: #d7c890;

  min-height: 100vh;

  text-align: center;

  overflow: hidden;

  position: relative;

}


/* =========================================
   GOLDEN ATMOSPHERE
========================================= */

body::before {

  content: "";

  position: fixed;

  width: 650px;

  height: 650px;

  left: 50%;

  top: 40%;

  transform:
    translate(-50%, -50%);

  background:

    radial-gradient(
      circle,
      rgba(215, 200, 144, 0.08),
      transparent 68%
    );

  animation:
    roomGlow 8s ease-in-out infinite alternate;

  pointer-events: none;

  z-index: 0;

}


@keyframes roomGlow {

  0% {

    transform:
      translate(-50%, -50%)
      scale(0.85);

    opacity: 0.45;

  }

  100% {

    transform:
      translate(-50%, -50%)
      scale(1.15);

    opacity: 1;

  }

}


/* =========================================
   NORMAL STARS
========================================= */

.star {

  position: fixed;

  width: 3px;

  height: 3px;

  border-radius: 50%;

  background: #ffffff;

  box-shadow:

    0 0 5px #ffffff,

    0 0 10px #d7c890,

    0 0 18px rgba(215, 200, 144, 0.7);

  pointer-events: none;

  z-index: 1;

  animation:
    twinkle 3s ease-in-out infinite alternate;

}


/* =========================================
   BIG STARS
========================================= */

.star.big {

  width: 4px;

  height: 4px;

  box-shadow:

    0 0 5px #ffffff,

    0 0 12px #ffffff,

    0 0 25px #d7c890,

    0 0 40px rgba(215, 200, 144, 0.8);

}


/* =========================================
   STAR TWINKLE
========================================= */

@keyframes twinkle {

  0% {

    opacity: 0.25;

    transform:
      scale(0.65);

  }

  50% {

    opacity: 0.65;

    transform:
      scale(1);

  }

  100% {

    opacity: 1;

    transform:
      scale(1.55);

  }

}


/* =========================================
   SPARKLE STAR
========================================= */

.star.sparkle {

  width: 3px;

  height: 3px;

  box-shadow:

    0 0 6px #ffffff,

    0 0 15px #ffffff,

    0 0 30px #d7c890;

}


/* Horizontal light */

.star.sparkle::before {

  content: "";

  position: absolute;

  width: 30px;

  height: 1px;

  left: -13px;

  top: 1px;

  background:

    linear-gradient(
      to right,
      transparent,
      #ffffff,
      transparent
    );

}


/* Vertical light */

.star.sparkle::after {

  content: "";

  position: absolute;

  width: 1px;

  height: 30px;

  left: 1px;

  top: -13px;

  background:

    linear-gradient(
      to bottom,
      transparent,
      #ffffff,
      transparent
    );

}


/* =========================================
   METEOR CANVAS
========================================= */

#meteorCanvas {

  position: fixed;

  inset: 0;

  width: 100%;

  height: 100%;

  pointer-events: none;

  z-index: 2;

}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {

  position: relative;

  z-index: 5;

  width: 90%;

  max-width: 430px;

  margin: 0 auto;

  min-height: 100vh;

}


/* =========================================
   TOP SECTION
========================================= */

.top-section {

  position: absolute;

  top: 30px;

  left: 50%;

  transform:
    translateX(-50%);

  width: 100%;

}


/* =========================================
   WELCOME TEXT
========================================= */

.welcome {

  margin: 0;

  color: #e7d99e;

  font-size: 21px;

  font-weight: 500;

  letter-spacing: 1px;

  text-shadow:

    0 0 5px #d7c890,

    0 0 12px rgba(215,200,144,0.8),

    0 0 25px rgba(215,200,144,0.45);

  opacity: 0;

  animation:
    welcomeIn 1.8s ease forwards;

}


/* =========================================
   WELCOME CURVE
========================================= */

.welcome span {

  display: inline-block;

}


.welcome span:nth-child(1),
.welcome span:nth-child(2) {

  transform:
    translateY(0);

}


.welcome span:nth-child(3),
.welcome span:nth-child(4) {

  transform:
    translateY(4px);

}


.welcome span:nth-child(5),
.welcome span:nth-child(6),
.welcome span:nth-child(7) {

  transform:
    translateY(8px);

}


.welcome span:nth-child(8),
.welcome span:nth-child(9) {

  transform:
    translateY(10px);

}


.welcome span:nth-child(10),
.welcome span:nth-child(11) {

  transform:
    translateY(8px);

}


.welcome span:nth-child(12),
.welcome span:nth-child(13) {

  transform:
    translateY(5px);

}


.welcome span:nth-child(14),
.welcome span:nth-child(15) {

  transform:
    translateY(2px);

}


/* =========================================
   WELCOME ANIMATION
========================================= */

@keyframes welcomeIn {

  from {

    opacity: 0;

    transform:
      translateY(-15px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* =========================================
   NAME
========================================= */

.name {

  margin:
    25px 0 0;

  font-size: 32px;

  letter-spacing: 5px;

  color: #f2d879;

  opacity: 0;

  transform:
    scale(0.9);

  text-shadow:

    0 0 5px #d7c890,

    0 0 12px #d7c890,

    0 0 25px rgba(215,200,144,0.8),

    0 0 45px rgba(215,200,144,0.35);

  animation:
    nameIn 1.5s ease forwards;

  animation-delay:

}


/* =========================================
   NAME ANIMATION
========================================= */

@keyframes nameIn {

  from {

    opacity: 0;

    transform:
      scale(0.9);

  }

  to {

    opacity: 1;

    transform:
      scale(1);

  }

}


/* =========================================
   PHOTO FRAME
========================================= */

.photo-frame {

  position: absolute;

  top: 145px;

  left: 50%;

  transform:
    translateX(-50%);

  width: 210px;

  height: 210px;

  display: flex;

  align-items: center;

  justify-content: center;

  z-index: 6;

}


/* =========================================
   OUTER ORNAMENT RING
========================================= */

.frame-outer {

  position: absolute;

  width: 210px;

  height: 210px;

  border-radius: 50%;

  border:
    2px solid #b99545;

  box-shadow:

    0 0 0 2px #4f3917,

    0 0 0 4px #d7b75b,

    0 0 0 6px #5c421a,

    0 0 12px rgba(215,183,91,0.35);

}


/* =========================================
   INNER ORNAMENT RING
========================================= */

.frame-inner {

  position: absolute;

  width: 192px;

  height: 192px;

  border-radius: 50%;

  border:
    2px solid #d9bd70;

  box-shadow:

    inset 0 0 0 2px #654919,

    inset 0 0 12px rgba(215,183,91,0.3);

}


/* =========================================
   PHOTO
========================================= */

.photo-area {

  position: relative;

  width: 174px;

  height: 174px;

  border-radius: 50%;

  overflow: hidden;

  background: #080706;

  border:
    2px solid #8e6a29;

  box-shadow:

    0 0 0 2px #30220e,

    0 0 12px rgba(215,183,91,0.3);

  z-index: 3;

}


.photo-area img {

  width: 100%;

  height: 100%;

  display: block;

  object-fit: cover;

}


/* =========================================
   UKIRAN ATAS / BAWAH
========================================= */

.frame-decoration {

  position: absolute;

  z-index: 8;

  color: #e4c56f;

  font-family: Georgia, serif;

  font-size: 24px;

  line-height: 1;

  text-shadow:

    0 1px 2px #000,

    0 0 5px rgba(215,183,91,0.5);

}


/* ATAS */

.frame-top {

  top: -9px;

  left: 50%;

  transform:
    translateX(-50%);

}


/* BAWAH */

.frame-bottom {

  bottom: -9px;

  left: 50%;

  transform:
    translateX(-50%)
    rotate(180deg);

}


/* KIRI */

.frame-left {

  left: -9px;

  top: 50%;

  transform:
    translateY(-50%)
    rotate(-90deg);

}


/* KANAN */

.frame-right {

  right: -9px;

  top: 50%;

  transform:
    translateY(-50%)
    rotate(90deg);

}


/* =========================================
   FRAME ORNAMENT DOTS
========================================= */

.frame-dot {

  position: absolute;

  width: 5px;

  height: 5px;

  background: #d9b85e;

<script>

const meteorCanvas =
  document.getElementById("meteorCanvas");

const meteorCtx =
  meteorCanvas.getContext("2d");


let meteors = [];

let meteorWidth =
  window.innerWidth;

let meteorHeight =
  window.innerHeight;


/* =========================================
   RESIZE CANVAS
========================================= */

function resizeMeteorCanvas() {

  meteorWidth =
    window.innerWidth;

  meteorHeight =
    window.innerHeight;

  meteorCanvas.width =
    meteorWidth;

  meteorCanvas.height =
    meteorHeight;

}


window.addEventListener(
  "resize",
  resizeMeteorCanvas
);


resizeMeteorCanvas();


/* =========================================
   NATURAL METEOR
========================================= */

class NaturalMeteor {

  constructor() {

    this.reset(true);

  }


  reset(firstSpawn = false) {

    /*
     * Meteor selalu muncul
     * dari bagian ATAS layar.
     *
     * Tetapi titik X berbeda-beda.
     */

    this.x =
      Math.random() *
      meteorWidth;

    this.y =
      -20 -
      Math.random() *
      250;


    /*
     * SEMUA METEOR
     * MENGGUNAKAN ARAH YANG SAMA.
     *
     * Atas → bawah agak ke kiri.
     */

    const angle =
      Math.PI / 2 + 0.35;


    /*
     * Kecepatan meteor.
     */

    this.speed =
      5 +
      Math.random() * 4;


    this.vx =
      Math.cos(angle) *
      this.speed;


    this.vy =
      Math.sin(angle) *
      this.speed;


    /*
     * UKURAN KECIL.
     */

    this.size =
      1.1 +
      Math.random() * 1.2;


    /*
     * EKOR PENDEK.
     */

    this.tail =
      45 +
      Math.random() * 40;


    /*
     * Transparansi.
     */

    this.alpha =
      0.55 +
      Math.random() * 0.35;


    /*
     * Delay agar meteor
     * tidak muncul bersamaan.
     */

    this.delay =
      firstSpawn
      ? Math.random() * 180
      : Math.random() * 90;

  }


  /* =======================================
     UPDATE
  ======================================== */

  update() {

    if (this.delay > 0) {

      this.delay--;

      return;

    }


    this.x +=
      this.vx;


    this.y +=
      this.vy;


    /*
     * Jika meteor keluar layar,
     * buat meteor baru dari atas
     * dengan titik berbeda.
     */

    if (

      this.y >
        meteorHeight + 100 ||

      this.x <
        -150 ||

      this.x >
        meteorWidth + 150

    ) {

      this.reset();

    }

  }


  /* =======================================
     DRAW
  ======================================== */

  draw() {

    if (this.delay > 0)
      return;


    /*
     * Panjang arah gerakan.
     */

    const length =
      Math.sqrt(
        this.vx * this.vx +
        this.vy * this.vy
      );


    const dirX =
      this.vx / length;


    const dirY =
      this.vy / length;


    /*
     * EKOR DI BELAKANG KEPALA.
     */

    const tailX =
      this.x -
      dirX *
      this.tail;


    const tailY =
      this.y -
      dirY *
      this.tail;


    /*
     * GRADIENT EKOR.
     *
     * Jauh = transparan.
     * Dekat kepala = terang.
     */

    const gradient =
      meteorCtx.createLinearGradient(
        tailX,
        tailY,
        this.x,
        this.y
      );


    gradient.addColorStop(
      0,
      "rgba(215,200,144,0)"
    );


    gradient.addColorStop(
      0.45,
      "rgba(215,200,144,0.08)"
    );


    gradient.addColorStop(
      0.75,
      "rgba(255,255,255,0.28)"
    );


    gradient.addColorStop(
      1,
      "rgba(255,255,255,0.9)"
    );


    /*
     * GAMBAR EKOR.
     */

    meteorCtx.save();


    meteorCtx.globalAlpha =
      this.alpha;


    meteorCtx.beginPath();


    meteorCtx.moveTo(
      tailX,
      tailY
    );


    meteorCtx.lineTo(
      this.x,
      this.y
    );


    meteorCtx.lineWidth =
      this.size * 1.4;


    meteorCtx.lineCap =
      "round";


    meteorCtx.strokeStyle =
      gradient;


    meteorCtx.shadowColor =
      "#ffffff";


    meteorCtx.shadowBlur =
      5;


    meteorCtx.stroke();


    meteorCtx.restore();


    /*
     * HALO KEPALA.
     */

    const glow =
      meteorCtx.createRadialGradient(
        this.x,
        this.y,
        0,
        this.x,
        this.y,
        this.size * 4
      );


    glow.addColorStop(
      0,
      "rgba(255,255,255,0.9)"
    );


    glow.addColorStop(
      0.4,
      "rgba(255,255,255,0.35)"
    );


    glow.addColorStop(
      1,
      "rgba(215,200,144,0)"
    );


    meteorCtx.beginPath();


    meteorCtx.arc(
      this.x,
      this.y,
      this.size * 4,
      0,
      Math.PI * 2
    );


    meteorCtx.fillStyle =
      glow;


    meteorCtx.fill();


    /*
     * KEPALA METEOR.
     */

    meteorCtx.save();


    meteorCtx.beginPath();


    meteorCtx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI * 2
    );


    meteorCtx.fillStyle =
      "#ffffff";


    meteorCtx.shadowColor =
      "#ffffff";


    meteorCtx.shadowBlur =
      7;


    meteorCtx.fill();


    meteorCtx.restore();

  }

}


/* =========================================
   JUMLAH METEOR
========================================= */

for (
  let i = 0;
  i < 7;
  i++
) {

  meteors.push(
    new NaturalMeteor()
  );

}


/* =========================================
   METEOR ANIMATION
========================================= */

function animateMeteors() {

  meteorCtx.clearRect(
    0,
    0,
    meteorWidth,
    meteorHeight
  );


  meteors.forEach(
    meteor => {

      meteor.update();

      meteor.draw();

    }
  );


  requestAnimationFrame(
    animateMeteors
  );

}


/* =========================================
   START METEOR
========================================= */

animateMeteors();

</script>
